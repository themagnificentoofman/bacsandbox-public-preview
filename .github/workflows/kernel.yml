name: Kernel QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BACSANDBOX_RUN_BENCHMARK: '0'
  BACSANDBOX_RUN_FBA_BENCHMARK: '0'
  BACSANDBOX_RUN_METABOLIC_SCALE: '0'
  BACSANDBOX_RUN_PHYSICS_BENCHMARK: '0'
  BACSANDBOX_RUN_PHYSICS_SCALE: '0'
  PYGAME_HIDE_SUPPORT_PROMPT: '1'
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  python-only:
    name: Python fallback (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify Python-only installation
        run: python -c "import importlib.util, pygame; assert pygame.IS_CE; assert importlib.util.find_spec('bacteria_c_kernel') is None"
      - name: Run full suite with Python fallbacks
        run: python -m unittest discover

  openmp:
    name: OpenMP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    env:
      BACSANDBOX_OPENMP: 'on'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "CPPFLAGS=-I$(brew --prefix libomp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"
          echo "ARCHFLAGS=-arch $(uname -m)" >> "$GITHUB_ENV"
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip check
      - name: Verify OpenMP extension
        run: python -c "import bacteria_c_kernel as kernel; assert kernel.openmp_enabled(), 'OpenMP build was requested but is disabled'; assert hasattr(kernel, 'MetabolicKernel'), 'Native MetabolicKernel is missing'"
      - name: Run kernel suite
        run: python -m unittest bacteria.test_kernel
      - name: Run physics kernel suite
        run: python -m unittest bacteria.test_physics_kernel
      - name: Run metabolic kernel suite
        run: python -m unittest bacteria.test_metabolic_architecture bacteria.test_metabolic_kernel
      - name: Run dietary translation suite
        run: python -m unittest bacteria.test_diet_translator
      - name: Run live FBA integration suite
        run: python -m unittest bacteria.test_metabolic_integration
      - name: Run FBA integration stress suite
        run: python -m unittest bacteria.test_integration_stress
      - name: Run comparative sweep suite
        run: python -m unittest bacteria.test_comparative_sweeps bacteria.test_parameter_audit
      - name: Run existing full suite
        run: python -m unittest bacteria.test_bacteria

  serial:
    name: Serial (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      BACSANDBOX_OPENMP: 'off'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip check
      - name: Verify serial extension
        run: python -c "import bacteria_c_kernel as kernel; assert not kernel.openmp_enabled(), 'Serial build unexpectedly enabled OpenMP'; assert hasattr(kernel, 'MetabolicKernel'), 'Native MetabolicKernel is missing'"
      - name: Run kernel suite
        run: python -m unittest bacteria.test_kernel
      - name: Run physics kernel suite
        run: python -m unittest bacteria.test_physics_kernel
      - name: Run metabolic kernel suite
        run: python -m unittest bacteria.test_metabolic_architecture bacteria.test_metabolic_kernel
      - name: Run dietary translation suite
        run: python -m unittest bacteria.test_diet_translator
      - name: Run live FBA integration suite
        run: python -m unittest bacteria.test_metabolic_integration
      - name: Run FBA integration stress suite
        run: python -m unittest bacteria.test_integration_stress
      - name: Run comparative sweep suite
        run: python -m unittest bacteria.test_comparative_sweeps bacteria.test_parameter_audit
      - name: Run required metabolic scale parity
        env:
          BACSANDBOX_RUN_METABOLIC_SCALE: '1'
        run: python -m unittest bacteria.test_metabolic_kernel.TestMetabolicScale.test_thousand_agents_repeated_adaptive_ticks
      - name: Run required physics scale parity
        env:
          BACSANDBOX_RUN_PHYSICS_SCALE: '1'
        run: python -m unittest bacteria.test_physics_kernel.TestPhysicsScale.test_thousand_agents_five_hundred_ticks
      - name: Run existing full suite
        run: python -m unittest bacteria.test_bacteria

  native-leaks:
    name: Native leaks (Valgrind, serial)
    runs-on: ubuntu-latest
    env:
      BACSANDBOX_OPENMP: 'off'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Build serial extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip check
          python -c "import bacteria_c_kernel as kernel; assert not kernel.openmp_enabled(), 'Leak job must exercise the serial kernel'"
      - name: Run focused native allocation stress
        shell: bash
        env:
          BACSANDBOX_NATIVE_STRESS_ITERATIONS: '2000'
          BACSANDBOX_NATIVE_METABOLIC_STRESS_ITERATIONS: '2000'
          BACSANDBOX_NATIVE_PHYSICS_STRESS_ITERATIONS: '2000'
        run: |
          suppression_args=()
          if [[ -f "$GITHUB_WORKSPACE/.github/valgrind-python.supp" ]]; then
            suppression_args+=("--suppressions=$GITHUB_WORKSPACE/.github/valgrind-python.supp")
          fi
          python_prefix="$(python -c 'import sys; print(sys.prefix)')"
          python_minor="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          for candidate in \
            "$python_prefix/share/valgrind/python3.supp" \
            "$python_prefix/share/doc/python${python_minor}/valgrind-python.supp" \
            /usr/lib/valgrind/python3.supp \
            "/usr/share/doc/python${python_minor}/valgrind-python.supp"; do
            if [[ -f "$candidate" ]]; then
              suppression_args+=("--suppressions=$candidate")
              break
            fi
          done
          valgrind \
            --tool=memcheck \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=99 \
            "${suppression_args[@]}" \
            python -m unittest \
              bacteria.test_kernel.TestNativeAllocationStress.test_repeated_results_are_collectible \
              bacteria.test_physics_kernel.TestNativePhysicsStress.test_repeated_preallocated_calls \
              bacteria.test_metabolic_kernel.TestNativeMetabolicStress.test_repeated_cache_churn_and_eviction
