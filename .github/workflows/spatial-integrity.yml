name: Spatial experiment integrity
on:
  push:
  pull_request:
jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - run: python -m pip install -r requirements.txt -r research/spatial_nutrient/requirements-spatial.txt
      - run: python -m pytest -q research/spatial_nutrient bacteria/test_experiment_support.py bacteria/test_live_fba_starvation.py bacteria/test_metabolic_integration.py bacteria/test_comparative_sweeps.py
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: '1'
