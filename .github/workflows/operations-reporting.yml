name: Operational workflow QA

on:
  pull_request:
    paths:
      - 'operations/workflow/**'
      - '.github/workflows/operations-reporting.yml'
      - 'AGENTS.md'
  push:
    branches: [master]
    paths:
      - 'operations/workflow/**'
      - '.github/workflows/operations-reporting.yml'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Controller, handoff, and reporting tests
        run: python -m unittest discover -s operations/workflow -p 'test_*.py' -v
